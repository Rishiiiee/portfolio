<html lang="en">

    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          var themeVersion = localStorage.getItem("theme-version");
          if (themeVersion !== "dark-default") {
            localStorage.setItem("theme", "dark");
            localStorage.setItem("theme-version", "dark-default");
            document.documentElement.classList.add("dark");
            return;
          }
          if (savedTheme !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
